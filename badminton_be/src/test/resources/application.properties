spring.application.name=badminton_be_test
spring.datasource.url=jdbc:sqlite:build/test_badminton.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.jwt.secret=TestSecretKeyForBadmintonBackendUnitAndIntegrationTests2026!
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
app.mail.log-otp-to-console=true
app.firebase.mock-enabled-when-unconfigured=true
app.storage.upload-dir=build/test-uploads
