# =====================================================================
# MAU cau hinh may ca nhan. Cach dung:
#   1. Sao chep file nay thanh application-local.properties (cung thu muc)
#   2. Dien gia tri that (SMTP Gmail App Password, Firebase Service Account)
#   3. Chay: ./gradlew bootRun --args='--spring.profiles.active=local'
# application-local.properties da nam trong .gitignore, KHONG commit file do.
# =====================================================================

# ---------- Database (SQLite) ----------
spring.datasource.url=jdbc:sqlite:badminton.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- JWT ----------
# Chuoi ngau nhien >= 32 ky tu. Tao nhanh: openssl rand -base64 48
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_STRING_AT_LEAST_32_CHARS
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7

# ---------- Email gui OTP (SMTP Gmail, dung App Password) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=CHANGE_ME_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=your-email@gmail.com
app.mail.log-otp-to-console=true

# ---------- Firebase Authentication & FCM ----------
# Duong dan toi file service account JSON cua Firebase Project, dat NGOAI thu muc du an
app.firebase.service-account-path=C:/secrets/badminton-firebase-service-account.json
app.firebase.mock-enabled-when-unconfigured=true

# ---------- PayOS (VietQR Payment Gateway) ----------
app.payos.client-id=CHANGE_ME
app.payos.api-key=CHANGE_ME
app.payos.checksum-key=CHANGE_ME
app.payos.webhook-url=https://<ngrok-domain>/api/v1/webhooks/payos

# ---------- Google Maps Geocoding ----------
app.google.maps-api-key=CHANGE_ME

# ---------- Mo hinh AI ----------
app.ai.provider=gemini
app.ai.api-key=CHANGE_ME
app.ai.model=gemini-2.5-flash

# ---------- Luu file tai len ----------
app.storage.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---------- CORS ----------
app.cors.allowed-origins=*
