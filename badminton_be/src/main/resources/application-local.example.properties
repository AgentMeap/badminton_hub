# =====================================================================
# MẪU cấu hình máy cá nhân. Cách dùng:
#   1. Sao chép file này thành application-local.properties (cùng thư mục)
#   2. Điền giá trị thật
#   3. Chạy: ./gradlew bootRun --args='--spring.profiles.active=local'
# application-local.properties đã nằm trong .gitignore, KHÔNG commit file đó.
# =====================================================================

# ---------- Database (SQL Server – quyết định D1) ----------
# Cần thêm vào build.gradle:
#   runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
#   implementation 'org.flywaydb:flyway-sqlserver'
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=badminton;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME

# Nếu nhóm vẫn dùng SQLite tạm thời, dùng 2 dòng dưới thay cho 3 dòng trên
# spring.datasource.url=jdbc:sqlite:badminton.db
# spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- JWT (chủ đề 4) ----------
# Chuỗi ngẫu nhiên >= 32 ký tự. Tạo nhanh: openssl rand -base64 48
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_STRING_AT_LEAST_32_CHARS
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7

# ---------- Email gửi OTP (SMTP Gmail, dùng App Password) ----------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=CHANGE_ME_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- VNPay sandbox (chủ đề 3) ----------
app.vnpay.tmn-code=CHANGE_ME
app.vnpay.hash-secret=CHANGE_ME
app.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
# URL công khai (ngrok) để VNPay gọi về
app.vnpay.return-url=https://<ngrok-domain>/api/v1/webhooks/vnpay/return
app.vnpay.ipn-url=https://<ngrok-domain>/api/v1/webhooks/vnpay/ipn

# ---------- Firebase Cloud Messaging (chủ đề 5) ----------
# Đường dẫn tới file service account, đặt NGOÀI thư mục dự án
app.firebase.service-account-path=C:/secrets/badminton-firebase-service-account.json

# ---------- Google Maps Geocoding (chủ đề 2) ----------
app.google.maps-api-key=CHANGE_ME

# ---------- Mô hình AI (chủ đề 6) ----------
app.ai.provider=gemini
app.ai.api-key=CHANGE_ME
app.ai.model=CHANGE_ME

# ---------- Lưu file tải lên ----------
app.storage.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ---------- CORS (cho Flutter web khi cần) ----------
app.cors.allowed-origins=http://localhost:3000
