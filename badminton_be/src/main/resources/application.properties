spring.application.name=badminton_be
server.port=${PORT:8080}

# Database: SQLite (WAL mode + Foreign Keys enabled + Single Writer Pool)
spring.datasource.url=${DB_URL:jdbc:sqlite:badminton.db?foreign_keys=on&journal_mode=WAL&busy_timeout=5000}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT & Security
app.jwt.secret=${JWT_SECRET:BadmintonBookingDefaultDevSecretKeyAtLeast32BytesLong2026!}
app.jwt.access-token-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-token-days=${JWT_REFRESH_DAYS:7}

# SMTP Mail (OTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SMTP_FROM:no-reply@badminton.vn}
app.mail.log-otp-to-console=${LOG_OTP_CONSOLE:true}

# Firebase Authentication
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
app.firebase.mock-enabled-when-unconfigured=${FIREBASE_MOCK_FALLBACK:true}

# Storage & Multipart
app.storage.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
